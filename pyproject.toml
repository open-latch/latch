[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latch"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<1.29",
  "filelock>=3.29.7,<4",
  "onnxruntime>=1.17.0",
  "tokenizers>=0.20.0",
  "numpy>=1.24.0",
  "sqlite-vec>=0.1.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["latch", "latch.*"]

[tool.setuptools.package-data]
"latch.store" = ["schema.sql"]
