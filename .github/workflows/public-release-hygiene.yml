name: Public release hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-hygiene:
    name: public-release-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public release hygiene check
        run: bash bin/latch_public_release_check.sh

  cursor-hook-contract:
    name: cursor-hook-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Test stdlib-only Cursor hook and lifecycle contract
        run: >-
          python -m pytest -q
          tests/test_cursor_backend.py
          tests/test_cursor_gate_state.py
          tests/test_cursor_hooks.py
          tests/test_cursor_hook_runtime.py
          tests/test_cursor_lifecycle_e2e.py
          tests/test_cursor_plugin.py
          tests/test_cursor_session.py
          tests/test_windows_stdio.py

  one-command-bootstrap-windows:
    name: one-command-bootstrap (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner and pinned bootstrap runtime manager
        run: python -m pip install pytest uv==0.11.28

      - name: Test PowerShell and Git Bash fresh installs and reruns
        # The 5.1 case is not redundant with the pwsh cases above it. Every
        # other PowerShell test resolves `pwsh` first, so they only exercise
        # PowerShell 7 native-argument passing; Windows PowerShell 5.1 is the
        # shell README.md tells users to paste into, and it drops unescaped
        # embedded double quotes when building a native command line.
        # The explicit exit propagation is required: a Windows job here has
        # previously reported green while pytest failed.
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_bootstrap_install.py::test_powershell_bootstrap_fresh_then_idempotent_on_windows `
            tests/test_bootstrap_install.py::test_powershell_iex_failure_preserves_session_and_environment `
            tests/test_bootstrap_install.py::test_windows_powershell_51_bootstrap_probes_real_argument_passing `
            tests/test_bootstrap_install.py::test_git_bash_bootstrap_fresh_then_idempotent_on_windows `
            tests/test_install_engine.py::test_absolute_kb_dir_normalizes_git_bash_path_on_windows `
            tests/test_quickstart.py::test_seed_backend_follows_selected_agent_surface `
            tests/test_quickstart.py::test_quickstart_persists_transient_env_pin_for_later_processes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  one-command-bootstrap-macos:
    name: one-command-bootstrap (macos-latest Bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Test stock Bash activation and sqlite-vec preflight
        run: >-
          python -m pytest -q
          tests/test_bootstrap_install.py::test_posix_bootstrap_zero_quickstart_args_on_stock_macos_bash
          tests/test_bootstrap_install.py::test_posix_sqlite_vec_preflight_blocks_before_configuration_writes

  proof-packet-windows:
    name: proof-packet-contract (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out proof history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a standard CRLF checkout
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "latch-proof-crlf"
          git clone --no-local --no-checkout . $target
          git -C $target config core.autocrlf true
          git -C $target checkout --detach $env:GITHUB_SHA
          $status = git -C $target status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $status) {
            throw "CRLF checkout is not clean: $status"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install proof test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Test proof packet through PowerShell
        # Drift-independent proof guards only. The packet-currency `--check`
        # (committed proof/ must be byte-current with the tree) runs at release,
        # not on every merge; see .github/workflows/release.yml. `--help` keeps
        # the PowerShell wrapper itself executed here — interpreter discovery,
        # argument forwarding, exit-code propagation — because it is the only
        # place bin/latch_proof_packet.ps1 actually runs, and a static text
        # assertion cannot catch a wrapper that no longer launches.
        shell: pwsh
        working-directory: ${{ runner.temp }}/latch-proof-crlf
        run: |
          python -m pytest -q tests/test_proof_packet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\latch_proof_packet.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full-suite:
    name: full-suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runners take ~2.7x as long as Ubuntu on the lifecycle matrix in
    # mcp-runtime-lifecycle.yml, so the Windows leg gets ~2.7x the budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 80 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out cumulative PR head
        uses: actions/checkout@v4
        with:
          # Proof receipts bind to the tooling commit immediately before the
          # generated-artifact commit, so the cumulative check needs history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install hashed merge-trust dependency lock
        # Both legs install the same hashed lock. It is a uv --universal
        # compile: every pin has a pure-Python or cp311/abi3 win_amd64 wheel
        # hash, and the Windows-only pins (colorama, pyreadline3, pywin32)
        # carry sys_platform markers, as proof-packet-contract already relies on.
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Install pinned bootstrap runtime manager
        if: matrix.os == 'windows-latest'
        # The hashed lock has no uv, but the Windows-only Git Bash bootstrap
        # test asserts uv is on PATH. Pin the version that
        # one-command-bootstrap-windows installs. No Ubuntu test needs uv.
        run: python -m pip install uv==0.11.28

      - name: Put Git Bash first on PATH
        if: matrix.os == 'windows-latest'
        # Tests run the repo's bash scripts with the first bash.exe in PATH
        # order, never C:\Windows\System32\bash.exe (the WSL launcher), so pin
        # that to Git Bash, the bash GitHub's own `shell: bash` steps use.
        # Only Git\bin: Git\usr\bin would also shadow Windows tools.
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Run dependency-complete offline-fixture suite
        if: matrix.os != 'windows-latest'
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q

      - name: Run dependency-complete offline-fixture suite through PowerShell
        if: matrix.os == 'windows-latest'
        # The explicit exit propagation is required: a Windows job here has
        # previously reported green while pytest failed.
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
