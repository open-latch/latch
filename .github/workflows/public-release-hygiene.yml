name: Public release hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-hygiene:
    name: public-release-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public release hygiene check
        run: bash bin/latch_public_release_check.sh

  cursor-hook-contract:
    name: cursor-hook-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Test stdlib-only Cursor hook and lifecycle contract
        run: >-
          python -m pytest -q
          tests/test_cursor_backend.py
          tests/test_cursor_gate_state.py
          tests/test_cursor_hooks.py
          tests/test_cursor_hook_runtime.py
          tests/test_cursor_lifecycle_e2e.py
          tests/test_cursor_plugin.py
          tests/test_cursor_session.py
          tests/test_windows_stdio.py

  one-command-bootstrap-windows:
    name: one-command-bootstrap (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner and pinned bootstrap runtime manager
        run: python -m pip install pytest uv==0.11.28

      - name: Test PowerShell and Git Bash fresh installs and reruns
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_bootstrap_install.py::test_powershell_bootstrap_fresh_then_idempotent_on_windows
          tests/test_bootstrap_install.py::test_powershell_iex_failure_preserves_session_and_environment
          tests/test_bootstrap_install.py::test_git_bash_bootstrap_fresh_then_idempotent_on_windows
          tests/test_install_engine.py::test_absolute_kb_dir_normalizes_git_bash_path_on_windows
          tests/test_quickstart.py::test_seed_backend_follows_selected_agent_surface
          tests/test_quickstart.py::test_quickstart_persists_transient_env_pin_for_later_processes

  one-command-bootstrap-macos:
    name: one-command-bootstrap (macos-latest Bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Test stock Bash activation and sqlite-vec preflight
        run: >-
          python -m pytest -q
          tests/test_bootstrap_install.py::test_posix_bootstrap_zero_quickstart_args_on_stock_macos_bash
          tests/test_bootstrap_install.py::test_posix_sqlite_vec_preflight_blocks_before_configuration_writes

  proof-packet-windows:
    name: proof-packet-contract (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out proof history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a standard CRLF checkout
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "latch-proof-crlf"
          git clone --no-local --no-checkout . $target
          git -C $target config core.autocrlf true
          git -C $target checkout --detach $env:GITHUB_SHA
          $status = git -C $target status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $status) {
            throw "CRLF checkout is not clean: $status"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install proof test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Test proof packet through PowerShell
        # Drift-independent proof guards only. The packet-currency `--check`
        # (committed proof/ must be byte-current with the tree) runs at release,
        # not on every merge; see .github/workflows/release.yml.
        shell: pwsh
        working-directory: ${{ runner.temp }}/latch-proof-crlf
        run: |
          python -m pytest -q tests/test_proof_packet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cursor-cumulative-full-suite:
    name: cursor-cumulative-full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cumulative PR head
        uses: actions/checkout@v4
        with:
          # Proof receipts bind to the tooling commit immediately before the
          # generated-artifact commit, so the cumulative check needs history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install hashed merge-trust dependency lock
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Run dependency-complete offline-fixture suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q
