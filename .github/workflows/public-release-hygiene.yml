name: Public release hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-hygiene:
    name: public-release-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public release hygiene check
        run: bash bin/latch_public_release_check.sh

  cursor-hook-contract:
    name: cursor-hook-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Test stdlib-only Cursor hook contract
        run: >-
          python -m pytest -q
          tests/test_cursor_gate_state.py
          tests/test_cursor_hooks.py
          tests/test_cursor_session.py
