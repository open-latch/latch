name: AI Review Evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ai-review-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Generate unprivileged artifact evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Fetch immutable base and head history
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/scripts/review_panel.py prepare-repository \
            --base-repository "$BASE_REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output .review-history \
            --fetch-history

      - name: Resolve the merge-base evidence scope
        id: scope
        env:
          REVIEW_PANEL_TARGET_ROOT: ${{ github.workspace }}/.review-history
        run: |
          python .github/scripts/review_panel.py scope \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run output recipes without provider secrets
        env:
          REVIEW_PANEL_TARGET_ROOT: ${{ github.workspace }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/review_panel.py artifacts \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --head-repository "$HEAD_REPOSITORY" \
            --output .review-panel-artifacts \
            --run-recipes true

      - name: Upload exact-head evidence packet
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            review-panel-evidence-${{
              github.event.pull_request.number
            }}-${{ github.event.pull_request.head.sha }}
          path: .review-panel-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
