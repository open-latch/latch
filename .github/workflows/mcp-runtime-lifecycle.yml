name: MCP runtime lifecycle

on:
  pull_request:
    paths:
      - "src/mcp_*.py"
      - "src/install_cursor.py"
      - "src/cursor_doctor.py"
      - "src/cursor_wiring.py"
      - "src/paths.py"
      - "src/hooks/_common.py"
      - "src/hooks/cursor_post_tool_use.py"
      - "src/windows_stdio.py"
      - "src/embeddings.py"
      - "src/codex_session.py"
      - "src/hooks/user_prompt_submit.py"
      - "src/doctor.py"
      - "tests/test_mcp_*.py"
      - "tests/test_install_cursor.py"
      - "tests/test_paths.py"
      - "tests/test_cursor_doctor.py"
      - "tests/test_hook_input.py"
      - "tests/test_wiring_version.py"
      - "tests/test_windows_stdio.py"
      - "tests/test_win_launcher_protocol.py"
      - "tests/test_doctor.py"
      - "tests/test_codex_session.py"
      - "docs/mcp_resource_architecture.md"
      - "requirements.txt"
      - ".github/workflows/mcp-runtime-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run lifecycle contract tests
        run: >-
          python -m pytest -q
          tests/test_mcp_lifecycle_contract.py
          tests/test_mcp_shared_runtime.py
          tests/test_doctor.py
          tests/test_codex_session.py
          tests/test_mcp_session_id.py
          tests/test_mcp_proxy_session.py
          tests/test_windows_stdio.py
          tests/test_win_launcher_protocol.py
          tests/test_install_cursor.py::test_cursor_mcp_launcher_uses_pythonw_only_when_available_on_windows
          tests/test_paths.py
          tests/test_cursor_doctor.py::test_check_mcp_launch_target
          tests/test_hook_input.py
          tests/test_wiring_version.py::test_windows_cursor_bundle_repair_preserves_console_interpreter
          tests/test_embed_daemon.py
