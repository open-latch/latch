name: MCP runtime lifecycle

on:
  pull_request:
    paths:
      - "src/mcp_*.py"
      - "src/embeddings.py"
      - "src/codex_session.py"
      - "src/hooks/user_prompt_submit.py"
      - "src/doctor.py"
      - "tests/test_mcp_*.py"
      - "tests/test_doctor.py"
      - "tests/test_codex_session.py"
      - "docs/mcp_resource_architecture.md"
      - "requirements.txt"
      - ".github/workflows/mcp-runtime-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run lifecycle contract tests
        run: >-
          python -m pytest -q
          tests/test_mcp_lifecycle_contract.py
          tests/test_mcp_shared_runtime.py
          tests/test_doctor.py
          tests/test_codex_session.py
          tests/test_mcp_session_id.py
          tests/test_mcp_proxy_session.py
          tests/test_embed_daemon.py
