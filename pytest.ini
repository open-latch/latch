# Marker registry only. Deliberately no `addopts`: adding a default `-m`
# selection here would silently change what every existing CI job runs, and the
# whole suite is meant to stay the default.
#
# The S1a adherence harness (KB id=5134) is cheap by construction — its smoke
# tier is graded deterministically and makes zero model calls — so it runs in
# CI with everything else. The markers exist so a job can select or deselect
# it, which is what makes G2's "harness green in CI" a thing you can point at.
#
#   run only the harness:   python -m pytest -m s1a_smoke
#   skip it:                python -m pytest -m "not s1a_smoke"
#   the live model path:    LATCH_S1A_LIVE=1 python -m pytest -m s1a_live
[pytest]
markers =
    s1a_smoke: S1a adherence harness, deterministic and free — runs in CI
    s1a_live: S1a adherence harness against a real model backend — makes model calls, opt-in via LATCH_S1A_LIVE
